/* Theater library and memory cards share the reader's paper, ink and type settings. */
.reader-top .theater-tab{font-size:11px!important;gap:5px!important;padding:7px 10px!important;white-space:nowrap}
.reader-top .theater-tab svg{width:15px!important;height:15px!important}
.theater-scroll{flex:1;overflow:auto;padding:100px 28px 60px;overscroll-behavior:contain}
.theater-library{max-width:1000px;margin:0 auto}
.theater-library-heading{display:flex;align-items:center;justify-content:space-between;gap:25px;padding:10px 0 30px;border-bottom:1px solid var(--line)}
.theater-eyebrow,.notes-eyebrow{color:var(--accent);font-size:11px;letter-spacing:2px;margin:0 0 14px}
.theater-library-heading h1{font:34px/1.4 var(--reading-font);font-weight:400;margin:0 0 12px}
.theater-library-heading p:last-child{font-size:12px;color:var(--muted);margin:0}
.theater-library-mark{color:var(--accent);opacity:.35;transform:rotate(-8deg)}
.theater-library-mark svg{width:70px;height:70px;stroke-width:1}
.theater-search{display:block;max-width:440px;margin:24px 0}
.theater-search input,.theater-jump select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:11px 13px;color:var(--ink);font:12px var(--reading-font)}
.theater-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.theater-more{grid-column:1/-1;text-align:center;padding:16px 0}
.theater-card{display:flex;flex-direction:column;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.theater-card.is-favorite{border-color:var(--accent);box-shadow:inset 3px 0 var(--accent)}
.theater-card-main{display:block;flex:1;width:100%;padding:24px 25px 16px;text-align:left;border:0;background:transparent;color:inherit;cursor:pointer}
.theater-card-kicker{font-size:10px;color:var(--accent);letter-spacing:.6px}
.theater-card h2{font:20px/1.65 var(--reading-font);font-weight:400;margin:12px 0;overflow-wrap:anywhere}
.theater-card-main>p{font:13px/1.9 var(--reading-font);color:var(--muted);margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.theater-card footer{display:flex;align-items:center;justify-content:space-between;padding:6px 20px 10px;gap:12px}
.theater-card time{font:10px Georgia,serif;color:var(--muted)}
.theater-card .icon-btn.active{color:var(--accent);background:var(--accent-soft)}
.theater-card .icon-btn.active svg{fill:var(--accent-soft)}
.theater-empty{grid-column:1/-1;text-align:center;padding:65px 12px;color:var(--muted)}
.theater-empty>svg{width:40px;height:40px;stroke-width:1}
.theater-empty h2{font:23px var(--reading-font);color:var(--ink);font-weight:400}
.theater-empty p{font-size:12px;line-height:1.9}
.theater-detail-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;color:var(--muted);font:11px Georgia,serif}
.theater-detail{max-width:760px;margin:0 auto}
.theater-detail>h1{font:30px/1.65 var(--reading-font);font-weight:400;margin:12px 0 20px;overflow-wrap:anywhere}
.theater-detail-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:23px}
.theater-jump{display:flex;gap:14px;align-items:center;border-top:1px solid var(--line);padding-top:20px;margin-bottom:35px}
.theater-jump>span{font-size:11px;white-space:nowrap;color:var(--muted)}
.theater-jump select{min-width:0}
.theater-content details>summary{cursor:pointer;font-family:var(--reading-font);color:var(--accent);margin-bottom:16px}
.theater-story-navigation{display:flex;justify-content:space-between;gap:15px;border-top:1px solid var(--line);margin-top:35px;padding-top:22px}
.theater-preview-result{margin-top:14px;font-size:12px;color:var(--accent);line-height:1.8}
.theater-preview-result p{margin:8px 0;padding:8px 0;border-top:1px solid var(--line)}
.theater-preview-result small{display:block;color:var(--muted);font-size:10px}
.theater-settings-bottom{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px;border-top:1px solid var(--line);padding-top:18px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.notes-intro{display:flex;align-items:center;justify-content:space-between;gap:40px;position:relative;padding:35px 42px;margin:16px 0 34px;border:1px solid var(--line);border-radius:10px;background:radial-gradient(ellipse at 90% 10%,var(--accent-soft),transparent 65%),repeating-linear-gradient(0deg,transparent 0,transparent 27px,#88734b08 28px),var(--paper);overflow:hidden}
.notes-intro h1{font:36px/1.4 var(--reading-font);font-weight:400;margin:0 0 12px;letter-spacing:1px}
.notes-intro-copy>p:not(.notes-eyebrow){font:14px/1.9 var(--reading-font);color:var(--muted);margin:0}
.notes-intro-count{display:flex;gap:7px;align-items:baseline;margin-top:24px}
.notes-intro-count strong{font:24px Georgia,serif;font-weight:400;color:var(--accent)}
.notes-intro-count span{font-size:10px;color:var(--muted)}
.notes-intro-count i{height:12px;width:1px;background:var(--line);margin:0 12px}
.notes-draw-invitation{flex:0 0 180px;text-align:center}
.notes-draw-invitation>small{display:block;font-size:10px;color:var(--muted);margin-top:10px;line-height:1.6}
.notes-deck-illustration{height:94px;width:100px;margin:2px auto 19px;position:relative;perspective:500px}
.notes-deck-illustration>span{position:absolute;inset:0 17px;background:var(--panel);border:1px solid var(--line);border-radius:5px;box-shadow:2px 5px 10px #0000000a}
.notes-deck-illustration>span:first-child{transform:rotate(-15deg) translate(-9px,4px)}
.notes-deck-illustration>span:nth-child(2){transform:rotate(12deg) translate(10px,3px)}
.notes-deck-illustration>span:last-child{display:grid;place-items:center;border-color:var(--accent);color:var(--accent);background:repeating-linear-gradient(45deg,transparent 0,transparent 5px,#88734b07 6px),var(--paper)}
.notes-deck-illustration svg{width:27px;height:27px;stroke-width:1}
.notes-draw-button{min-width:110px;justify-content:center;letter-spacing:3px}
.notes-library-heading{align-items:center;gap:15px}
.notes-library-heading select{max-width:240px;min-width:0}
.notes-collection{align-items:start;gap:21px}
.collection-note{padding:24px 26px;background:var(--panel);box-shadow:0 3px 16px #00000003}
.collection-note:before{display:none}
.collection-note-source{display:flex;align-items:center;gap:12px;padding-bottom:17px;border-bottom:1px solid var(--line)}
.collection-note-cover{width:36px;height:49px;object-fit:cover;flex:0 0 36px;border-radius:2px;box-shadow:2px 3px 7px #0002}
.collection-note-source>div{min-width:0;display:grid;gap:6px}
.collection-note-source strong{font:12px/1.5 var(--reading-font);font-weight:400;overflow-wrap:anywhere}
.collection-note-source>div>span{font-size:10px;color:var(--muted);overflow-wrap:anywhere}
.collection-note .note-quote{margin:21px 0;font-size:16px;line-height:2}
.collection-note .note-comment{white-space:pre-wrap;border-top:0;background:var(--accent-soft);padding:13px 15px;border-radius:4px;color:var(--ink);font:12px/1.9 var(--reading-font)}
.note-comment-label{display:block;font-size:9px;color:var(--accent);letter-spacing:1px;margin-bottom:5px}
.collection-note .note-footer{margin-top:17px;font-size:9px}
.collection-note .note-footer time{color:var(--muted);white-space:nowrap}
.notes-empty{grid-column:1/-1;padding:65px 15px}
.memory-cover-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(145deg,var(--accent-soft),var(--paper));color:var(--accent);text-align:center;overflow:hidden}
.memory-cover-placeholder strong{font:15px/1.8 var(--reading-font);font-weight:400;padding:0 12px;overflow-wrap:anywhere}
.memory-cover-placeholder svg{width:29px;height:29px;stroke-width:1;margin-bottom:12px}
.collection-note-cover.memory-cover-placeholder strong{display:none}
.collection-note-cover.memory-cover-placeholder svg{width:19px;height:19px;margin:0}
.memory-draw-modal{width:820px!important}
.memory-draw-modal .modal-body{padding:24px;background:var(--bg)}
.memory-draw-stage{perspective:1600px}
.memory-card-flip{position:relative;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.2,.75,.2,1);min-height:430px}
.memory-card-flip.is-revealed{transform:rotateY(180deg)}
.memory-card-back,.memory-card-front{backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 12px 30px #0000000c}
.memory-card-back{position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0,transparent 8px,#88734b0b 9px),var(--paper);color:var(--accent);display:flex;align-items:center;justify-content:center}
.memory-card-back:before{content:"";position:absolute;inset:17px;border:1px solid var(--line);border-radius:3px}
.memory-card-back-corner{position:absolute;top:36px;left:38px;font:10px Georgia,serif;letter-spacing:3px}
.memory-card-back-number{position:absolute;bottom:34px;right:38px;font:12px Georgia,serif;letter-spacing:2px}
.memory-card-back-center{display:flex;flex-direction:column;align-items:center;gap:18px}
.memory-card-back-center>svg{width:45px;height:45px;stroke-width:1}
.memory-card-back-center>span{font:23px var(--reading-font);letter-spacing:3px}
.memory-card-back-center>i{width:40px;height:1px;background:var(--line)}
.memory-card-back-center>small{font:11px var(--reading-font);color:var(--muted);letter-spacing:2px}
.memory-card-front{min-height:430px;transform:rotateY(180deg);background:radial-gradient(ellipse at 0 0,var(--accent-soft),transparent 50%),var(--paper)}
.memory-card-ribbon{display:flex;align-items:center;justify-content:space-between;padding:19px 29px;border-bottom:1px solid var(--line);color:var(--accent);font:10px Georgia,var(--reading-font);letter-spacing:2px}
.memory-card-main{display:grid;grid-template-columns:145px minmax(0,1fr);gap:29px;padding:28px 29px}
.memory-card-book{min-width:0;text-align:center}
.memory-card-cover{width:128px;height:180px;object-fit:cover;border-radius:2px 5px 5px 2px;box-shadow:6px 7px 14px #0000001c;margin:0 auto 18px}
.memory-card-book>span{display:block;font-size:9px;color:var(--muted);letter-spacing:2px;margin:4px 0 8px}
.memory-card-book h3{font:14px/1.9 var(--reading-font);font-weight:400;margin:0;color:var(--ink);overflow-wrap:anywhere}
.memory-card-writing{min-width:0}
.memory-card-chapter{font:11px/1.9 var(--reading-font);color:var(--accent);padding-bottom:13px;border-bottom:1px solid var(--line)}
.memory-card-quote{position:relative;font:18px/2.05 var(--reading-font);white-space:pre-wrap;color:var(--ink);margin:20px 0;overflow-wrap:anywhere;max-height:310px;overflow:auto;padding-right:6px;scrollbar-width:thin}
.memory-card-note{background:var(--panel);border-left:2px solid var(--accent);padding:12px 15px;margin:18px 0 22px}
.memory-card-note>span{color:var(--accent);font-size:9px;letter-spacing:1px}
.memory-card-note p{font:13px/1.9 var(--reading-font);white-space:pre-wrap;overflow-wrap:anywhere;margin:7px 0 0;color:var(--ink)}
.memory-card-note-empty{font:11px/1.8 var(--reading-font);color:var(--muted);margin:20px 0}
.memory-card-dates{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:22px 0 0;padding-top:16px;border-top:1px solid var(--line)}
.memory-card-dates dt{font-size:9px;color:var(--muted);margin-bottom:7px;letter-spacing:.5px}
.memory-card-dates dd{font:11px/1.6 Georgia,var(--reading-font);margin:0;color:var(--ink)}
.memory-card-footnote{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:15px 29px;border-top:1px solid var(--line);font:9px/1.8 var(--reading-font);color:var(--muted)}
.memory-card-footnote>span{letter-spacing:1px}
.memory-draw-status{font:11px/1.8 var(--reading-font);text-align:center;color:var(--muted);min-height:20px;margin:16px 0}
.memory-draw-actions{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px}
